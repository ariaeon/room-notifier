name: Room notifier

on:
  # Triggered every 15 minutes by cron-job.org via the workflow dispatch API
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node index.js
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
